# This config file handles all commands for this plugin allowing all commands to be dynamically changed
#
# Command/Argument Node parameters
# Required: Command
# Optional: Permission, Aliases, Info, Cooldown
#
# Command node structure is:
# Base: | Changing this node does nothing
#   Command: <command> 			| Changing this changes the command/argument for this node
#   Permission: <permission> 	| Adds permission to this command/argument
#   Aliases: 					| Add direct command alias to this node
#   - alias1
#   - alias2
#   Info: 						| Add typeahead's for this command
#   - typeahead1
#   - typeahead2
#   Enabled: <true/false>		| Enable/disable this command
#   Cooldown: <seconds>			| Not yet implemented
Bank:
  Command: bank
  Argument:
    Admin:
      Command: admin
      Permission: bank.admin
      Argument:
        Reload:
          Command: reload
          Permission: bank.admin.reload
        Block:
          Command: block
          Permission: bank.admin.block
          Argument:
            Add:
              Command: add
              Permission: bank.admin.block.add
            Remove:
              Command: remove
              Permission: bank.admin.block.remove
        Debug:
          Command: debug
          Permission: bank.admin.debug
          Argument:
            Item:
              Command: item
              Permission: bank.admin.debug.item
        Exp:
          Command: exp
          Permission: bank.admin.exp
          Argument:
            Add:
              Command: add
              Permission: bank.admin.exp.add
              Info:
              - <player> <amount>
            Balance:
              Command: balance
              Permission: bank.admin.exp.balance
              Info:
              - <player>
            Subtract:
              Command: subtract
              Permission: bank.admin.exp.subtract
              Info:
              - <player> <amount>
        Reset:
          Command: reset
          Permission: bank.admin.reset
          Info:
          - <name>
        Fix:
          Command: fix
          Permission: bank.admin.fix
          Argument:
            Usernames:
              Command: usernames
              Permission: bank.admin.fix.usernames
        Pin:
          Command: pin
          Permission: bank.admin.pin
          Argument:
            Reset:
              Command: reset
              Permission: bank.admin.pin.reset
        Item:
          Command: item
          Permission: bank.admin.item
          Argument:
            Blacklist:
              Command: blacklist
              Permission: bank.admin.item.blacklist
            Trashblacklist:
              Command: trashblacklist
              Permission: bank.admin.item.blacklist
            Default:
              Command: default
              Permission: bank.admin.item.default
        Permission:
          Command: permission
          Permission: bank.admin.permission
          Argument:
            History:
              Command: history
              Permission: bank.admin.permission.history
              Info:
              - <name>
            Update:
              Command: update
              Permission: bank.admin.permission.update
              Info:
              - <name>
        Lookup:
          Command: lookup
          Permission: bank.admin.lookup
          Info:
          - <name>
        Money:
          Command: money
          Permission: bank.admin.money
          Argument:
            Add:
              Command: add
              Permission: bank.admin.money.add
              Info:
              - <player> <amount>
            Balance:
              Command: balance
              Permission: bank.admin.money.balance
              Info:
              - <player>
            Subtract:
              Command: subtract
              Permission: bank.admin.money.subtract
              Info:
              - <player> <amount>
        Open:
          Command: open
          Permission: bank.admin.open
          Info:
          - <player>
        Force:
          Command: force
          Permission: bank.admin.force
          Argument:
            Open:
              Command: open
              Permission: bank.admin.force.open
              Info:
              - <player>
        Lock:
          Command: lock
          Permission: bank.admin.lock
          Info:
          - <player> <true/false>
        Save:
          Command: save
          Permission: bank.admin.save
        Slots:
          Command: slots
          Permission: bank.admin.slots
          Argument:
            Add:
              Command: add
              Permission: bank.admin.slots.add
              Info:
              - <player> <amount>
            Set:
              Command: set
              Permission: bank.admin.slots.set
              Info:
              - <player> <amount>
        Tax:
          Command: tax
          Permission: bank.admin.tax
          Argument:
            Info:
              Command: withdraw
              Permission: bank.admin.tax.info
            Withdraw:
              Command: withdraw
              Permission: bank.admin.tax.withdraw
              Info:
              - <player> <amount>
        Npc:
          Command: npc
          Permission: bank.admin.npc
          Argument:
            Setopentypes:
              Command: setopentypes
              Permission: bank.admin.npc.setopentypes
              Info:
              - '[types...]'
    Eco:
      Command: eco
      Permission: bank.admin.eco
      Argument:
        Give:
          Command: give
          Permission: bank.admin.give
          Info:
          - <name> <amount>
        Set:
          Command: set
          Permission: bank.admin.set
          Info:
          - <name> <amount>
        Take:
          Command: take
          Permission: bank.admin.take
          Info:
          - <name> <amount>
    Exp:
      Command: exp
      Permission: bank.exp
      Argument:
        # Enable command opentypes subset in config.yml
        Open:
          Command: open
          Permission: bank.exp.open
        Balance:
          Command: balance
          Permission: bank.exp.balance
        Deposit:
          Command: deposit
          Permission: bank.exp.deposit
          Info:
          - <amount>
          Argument:
            All:
              Command: all
              Permission: bank.exp.deposit.all
        Withdraw:
          Command: withdraw
          Permission: bank.exp.withdraw
          Info:
          - <amount>
          Argument:
            All:
              Command: all
              Permission: bank.exp.withdraw.all
        Send:
          Command: send
          Permission: bank.exp.send
    Money:
      Command: money
      Permission: bank.money
      Argument:
        # Enable command opentypes subset in config.yml
        Open:
          Command: open
          Permission: bank.money.open
        Balance:
          Command: balance
          Permission: bank.money.balance
        Deposit:
          Command: deposit
          Permission: bank.money.deposit
          Info:
          - <amount>
          Argument:
            All:
              Command: all
              Permission: bank.money.deposit.all
        Pay:
          Command: pay
          Permission: bank.money.pay
          Info:
          - <name> <amount>
        Withdraw:
          Command: withdraw
          Permission: bank.money.withdraw
          Info:
          - <amount>
          Argument:
            All:
              Command: all
              Permission: bank.money.withdraw.all
    Open:
      Command: open
      Permission: bank.open.command
      Argument:
        # Enable command advanced in config.yml
        Exp:
          Command: exp
          Permission: bank.open.command.exp
        # Enable command advanced in config.yml
        Items:
          Command: items
          Permission: bank.open.command.items
        # Enable command advanced in config.yml
        Loans:
          Command: loans
          Permission: bank.open.command.loans
        # Enable command advanced in config.yml
        Menu:
          Command: menu
          Permission: bank.open.command.menu
        # Enable command advanced in config.yml
        Money:
          Command: money
          Permission: bank.open.command.money
        # Enable command advanced in config.yml
        Pin:
          Command: pin
          Permission: bank.open.command.pin
    Top:
      Command: top
      Permission: bank.top
      Argument:
        Money:
          Command: money
          Permission: bank.top.money
          Info:
          - <page>
        Exp:
          Command: exp
          Permission: bank.top.exp
          Info:
          - <page>
    Info:
      Command: info
      Permission: bank.info
